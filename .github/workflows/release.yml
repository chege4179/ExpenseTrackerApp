name: Deploy Release App to Firebase App Distribution

on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7


      - name: Create Local Properties File
        run: cat /home/runner/work/ExpenseTrackerApp/ExpenseTrackerApp/local.properties | base64
      - name: Putting data
        env:
          DATA: ${{ secrets.PROPERTIES_CONTENT }}
        run: echo $DATA > /home/runner/work/ExpenseTrackerApp/ExpenseTrackerApp/local.properties

      - name: Putting data into distribution.json
        env:
          DATA: ${{ secrets.CREDENTIAL_FILE_CONTENT }}
        run: echo "$DATA" > /home/runner/work/ExpenseTrackerApp/ExpenseTrackerApp/distribution.json

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 17
          cache: gradle

      - name: Build App with Gradle and upload to Firebase App Distribution
        run: ./gradlew assembleRelease appDistributionUploadRelease -Pandroidx.baselineprofile.skipgeneration=true

      - name: Upload a Build Artifact (APK)
        uses: actions/upload-artifact@v7
        with:
          name: app
          path: app/build/outputs/apk/release/app-release.apk

