name: Deploy Release App to Firebase App Distribution

on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7


      - name: Create Local Properties File
        run: cat /home/runner/work/ExpenseTrackerApp/ExpenseTrackerApp/local.properties | base64
      - name: Putting data
        env:
          DATA: ${{ secrets.PROPERTIES_CONTENT }}
        run: echo $DATA > /home/runner/work/ExpenseTrackerApp/ExpenseTrackerApp/local.properties

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 17
          cache: gradle

      - name: Build Release App
        run: ./gradlew assembleRelease -Pandroidx.baselineprofile.skipgeneration=true

      - name: Upload a Build Artifact (APK)
        uses: actions/upload-artifact@v7
        with:
          name: app
          path: app/build/outputs/apk/release/app-release.apk

      - name: Upload artifact to Firebase App Distribution
        env:
          CREDENTIAL_FILE_CONTENT: ${{ secrets.CREDENTIAL_FILE_CONTENT }}
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-credentials.json"
          echo "$CREDENTIAL_FILE_CONTENT" > "$GOOGLE_APPLICATION_CREDENTIALS"
          ./gradlew appDistributionUploadRelease -Pandroidx.baselineprofile.skipgeneration=true
